
name: Build Python APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool libtool-bin \
            gettext autopoint pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo-dev cmake libffi-dev libssl-dev

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle/caches
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.34

      - name: Setup Android SDK and Fix sdkmanager
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "Android SDK root: $SDK_ROOT"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory does not exist: $SDK_ROOT"
            exit 1
          fi

          # Find sdkmanager in the modern Android command-line tools.
          SDKMANAGER=""

          if [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          # Check the legacy location as a fallback.
          if [ -z "$SDKMANAGER" ] && [ -f "$SDK_ROOT/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "Checked: $SDK_ROOT/cmdline-tools/"
            echo "Checked: $SDK_ROOT/tools/bin/"
            echo "Available SDK directories:"
            ls -la "$SDK_ROOT" || true
            ls -la "$SDK_ROOT/cmdline-tools" || true
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"

          chmod +x "$SDKMANAGER"

          # Accept Android SDK licenses.
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          # Install the required Android SDK packages.
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          # Buildozer 1.5.0 may expect the old tools/bin location.
          mkdir -p "$SDK_ROOT/tools/bin"
          ln -sfn "$SDKMANAGER" "$SDK_ROOT/tools/bin/sdkmanager"

          # Link the SDK to Buildozer's expected directory.
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$(dirname "$BUILDOZER_SDK")"
          rm -rf "$BUILDOZER_SDK"
          ln -s "$SDK_ROOT" "$BUILDOZER_SDK"

          # Set environment variables for subsequent steps.
          {
            echo "ANDROID_HOME=$BUILDOZER_SDK"
            echo "ANDROID_SDK_ROOT=$BUILDOZER_SDK"
            echo "ANDROIDSDK=$BUILDOZER_SDK"
            echo "$BUILDOZER_SDK/tools/bin"
            echo "$SDK_ROOT/platform-tools"
          } >> "$GITHUB_ENV"

          # Verify the exact path Buildozer needs.
          echo "Checking Buildozer sdkmanager path..."

          test -f "$BUILDOZER_SDK/tools/bin/sdkmanager"
          "$BUILDOZER_SDK/tools/bin/sdkmanager" --version

          echo "Android SDK setup completed successfully."

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf bin

          buildozer -v android debug

          echo "Checking generated APK..."
          ls -lh bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
