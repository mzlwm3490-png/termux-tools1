name: Build Python APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libtool-bin gettext autopoint pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake libffi-dev libssl-dev

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle/caches
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.34

      - name: Setup Android SDK and Buildozer compatibility
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found: $SDKMANAGER"
            find /usr/local/lib/android /opt -path '*/cmdline-tools/*/bin/sdkmanager' -type f 2>/dev/null | head -20 || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          # Buildozer 1.5.0 probes the legacy tools/bin path.
          mkdir -p "$SDK_ROOT/tools/bin"
          cat > "$SDK_ROOT/tools/bin/sdkmanager" <<EOF
          #!/usr/bin/env bash
          exec "$SDKMANAGER" "\$@"
          EOF
          chmod +x "$SDK_ROOT/tools/bin/sdkmanager"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" ]; then
            cat > "$SDK_ROOT/tools/bin/avdmanager" <<EOF
          #!/usr/bin/env bash
          exec "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "\$@"
          EOF
            chmod +x "$SDK_ROOT/tools/bin/avdmanager"
          fi

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$(dirname "$BUILDOZER_SDK")"
          rm -rf "$BUILDOZER_SDK"
          ln -s "$SDK_ROOT" "$BUILDOZER_SDK"
          {
            echo "ANDROID_HOME=$BUILDOZER_SDK"
            echo "ANDROIDSDK=$BUILDOZER_SDK"
            echo "ANDROID_SDK_ROOT=$BUILDOZER_SDK"
          } >> "$GITHUB_ENV"
          # Do not execute sdkmanager with --help or --version here.
          # This command-line-tools sdkmanager interprets either option as
          # an empty package request on some runner images and exits non-zero.
          # Buildozer will invoke the wrapper with real package arguments.
          test -x "$BUILDOZER_SDK/tools/bin/sdkmanager"
          test -x "$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "Android SDK manager compatibility wrapper is ready."

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          
          rm -rf bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
